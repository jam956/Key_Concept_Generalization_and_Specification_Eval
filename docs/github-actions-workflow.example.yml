name: fixture-and-contract-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m kce_eval validate fixtures
      - run: python -m kce_eval validate data/kissinger/kissinger-standalone-article.json
      - run: python -m kce_eval.suite encoding
      - run: python -m kce_eval.suite decoding
